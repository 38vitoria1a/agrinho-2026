<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agrinho 2026 - Agro Forte, Futuro Sustentável</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Agro Forte, Futuro Sustentável</h1>
        <p>Equilíbrio entre Produção e Meio Ambiente</p>
    </header>

    <main class="container">
        <section class="card">
            <h2>Simulador de Diagnóstico Sustentável</h2>
            <p>Insira os dados da sua propriedade para avaliar o equilíbrio ambiental da produção.</p>
            
            <form id="calc-form">
                <div class="form-group">
                    <label for="area">Área Total da Propriedade (hectares):</label>
                    <input type="number" id="area" required min="1" placeholder="Ex: 50">
                </div>

                <div class="form-group">
                    <label for="reserva">Área de Preservação/Reserva Legal (hectares):</label>
                    <input type="number" id="reserva" required min="0" placeholder="Ex: 10">
                </div>

                <div class="form-group">
                    <label for="irrigacao">Sistema de Irrigação Predominante:</label>
                    <select id="irrigacao">
                        <option value="eficiente">Gotejamento / Microaspersão (Alta Eficiência)</option>
                        <option value="moderado">Aspersão Comum (Média Eficiência)</option>
                        <option value="ineficiente">Inundação / Sulco (Baixa Eficiência)</option>
                    </select>
                </div>

                <button type="button" onclick="calcularDiagnostico()">Gerar Diagnóstico</button>
            </form>
        </section>

        <section id="resultado" class="card hidden">
            <h2>Resultado do Diagnóstico</h2>
            <div id="resultado-conteudo"></div>
            <button type="button" onclick="reiniciar()">Novo Cálculo</button>
        </section>
    </main>

    <footer>
        <p>Projeto Desenvolvido para o Concurso Agrinho 2026</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
